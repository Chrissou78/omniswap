name: Check price alerts

# Vercel's Hobby plan caps cron at once per day, which is far too infrequent for
# price alerts - so the schedule lives here instead (GitHub Actions is free for
# this) and just pokes the protected API route.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert check
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL variable or CRON_SECRET secret is not set - skipping."
            exit 1
          fi

          response=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/cron/check-alerts")

          echo "HTTP $response"
          cat /tmp/body
          echo

          # Fail the job on a non-2xx so a broken cron is visible rather than silent.
          case "$response" in
            2*) exit 0 ;;
            *) exit 1 ;;
          esac
